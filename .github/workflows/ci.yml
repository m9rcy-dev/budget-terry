name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs before the checks below: @budget-terry/types and
      # @budget-terry/validation are consumed via their compiled dist
      # output, not raw source, so a fresh checkout can't typecheck or
      # test anything that imports them until this has run once.
      - name: Build
        run: pnpm build

      - name: Formatting check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration
        env:
          # AUTH_SECRET and DATABASE_URL have no defaults (env.ts) and are
          # only ever supplied locally via the gitignored apps/api/.env —
          # CI has neither. Only the real AppModule (integration tests
          # boot it; unit tests use fake config objects) validates env at
          # all, and it does so synchronously the moment AppModule is
          # first imported — before the Testcontainers harness
          # (test/integration-app.ts) gets a chance to set the real,
          # ephemeral-container DATABASE_URL. This placeholder only needs
          # to satisfy that early presence check; Prisma picks up the
          # correct Testcontainers URL later, once the harness overwrites
          # process.env.DATABASE_URL, before any query actually runs —
          # confirmed by simulating this exact CI condition locally (no
          # .env file, only these two vars set): 79/79 tests pass.
          AUTH_SECRET: "test-secret-that-is-at-least-32-characters-long"
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
